name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_DATABASE_URL: postgresql://qtm:qtm@localhost:5432/qtm_test?schema=public
  DATABASE_URL: postgresql://qtm:qtm@localhost:5432/qtm_test?schema=public

jobs:
  quality:
    name: Lint, types, unit, integration, security & build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: qtm
          POSTGRES_PASSWORD: qtm
          POSTGRES_DB: qtm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qtm -d qtm_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install (fails if the lockfile is out of date)
        run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm build:shared
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm -r typecheck
      - name: Unit tests
        run: |
          pnpm --filter @qtm/shared test
          pnpm --filter @qtm/api test:unit
          pnpm --filter @qtm/web test
      - name: Integration & API tests (real PostgreSQL)
        run: pnpm --filter @qtm/api test:integration
      - name: Security tests (access control, auth, uploads, attack payloads)
        run: pnpm --filter @qtm/api test:security
      - name: Build
        run: pnpm build
      - name: Dependency audit (fails on high/critical)
        run: pnpm audit --audit-level high

  coverage:
    name: Coverage (thresholds enforced)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: qtm
          POSTGRES_PASSWORD: qtm
          POSTGRES_DB: qtm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qtm -d qtm_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tests with coverage
        run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          for pkg in packages/shared apps/api apps/web; do
            node -e 'const t=require(process.argv[1]).total;console.log(`| ${process.argv[2]} | ${t.lines.pct}% | ${t.statements.pct}% | ${t.functions.pct}% | ${t.branches.pct}% |`)' "./$pkg/coverage/coverage-summary.json" "$pkg"
          done | { echo '| Package | Lines | Statements | Functions | Branches |'; echo '|---|---|---|---|---|'; cat; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            apps/api/coverage
            apps/web/coverage
            packages/shared/coverage
          retention-days: 14

  e2e:
    name: E2E (Playwright)
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_USER: qtm
          POSTGRES_PASSWORD: qtm
          POSTGRES_DB: qtm_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U qtm -d qtm_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - name: Install Chromium
        run: pnpm --filter @qtm/web exec playwright install --with-deps chromium
      - name: Run E2E
        run: pnpm test:e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 14

  docker:
    name: Docker images & Compose smoke test
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build images
        run: |
          docker build -f apps/api/Dockerfile -t qtm-api:ci .
          docker build -f apps/web/Dockerfile -t qtm-web:ci .
      - name: Compose smoke test (start, migrate, health, proxy, persistence, shutdown)
        run: ./scripts/compose-smoke.sh
